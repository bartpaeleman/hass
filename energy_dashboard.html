<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Dashboard</title>
    <style>
        :root {
            --bg: #0a0c0f;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .house-wrap {
            position: relative;
            width: 100%;
            max-width: 1797.28px; /* Match SVG viewBox width */
            aspect-ratio: 1797.28 / 1003.13;
        }

        .house-wrap img {
            width: 100%;
            height: auto;
            display: block;
        }

        .house-wrap svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Make SVG purely visual */
        }

        /* SVG Colors */
        .cls-1 { fill: none; stroke: #00aeef; } /* Gas */
        .cls-2 { fill: none; stroke: #f7941d; } /* Battery */
        .cls-3 { fill: none; stroke: #ed1c24; } /* Export Grid */
        .cls-4 { fill: none; stroke: #fee756; } /* Import Grid */
        .cls-5 { fill: none; stroke: #39b54a; } /* Solar */

        /* Animation specific styles */
        .house-wrap path {
            stroke-width: 8px; /* Adjust as needed */
            stroke-dasharray: 20 20; /* 20px dash, 20px gap */
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Forward Animation */
        @keyframes flow-fwd {
            to { stroke-dashoffset: -40; }
        }

        /* Reverse Animation */
        @keyframes flow-rev {
            to { stroke-dashoffset: 40; }
        }

        /* Apply animations to specific flows */
        #Gas.active, #Gas-2.active {
            animation: flow-fwd 1s linear infinite;
        }

        #ImportGrid.active, #ImportGrid-2.active {
            animation: flow-fwd 1s linear infinite;
        }

        #BatteryUsed.active {
            animation: flow-fwd 1s linear infinite; /* Adjust based on flow direction */
        }

        #ExportGrid.active, #ExportGrid-2.active {
            animation: flow-rev 1s linear infinite;
        }

        #SolarToBattery.active, #SolarUsed.active {
            animation: flow-fwd 1s linear infinite;
        }

    </style>
</head>
<body>
    <div class="house-wrap">
        <img src="IMGS/MyHouse.png" alt="My House">
        <svg id="Utilities" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1797.28 1003.13">
            <path id="Gas" class="cls-1" d="M 921.51 740.56 L 743.09 740.56 L 743.09 681.21 L 747.17 681.21 L 747.17 736.48 L 921.51 736.48 L 921.51 740.56 Z"/>
            <path id="Gas-2" data-name="Gas" class="cls-1" d="M 926.38 745.59 L 930.45 745.59 L 930.45 892.99 L 926.38 892.99 Z"/>
            <path id="ImportGrid" class="cls-4" d="M 933.17 745.59 L 937.24 745.59 L 937.24 904.04 L 933.17 904.04 Z"/>
            <path id="ImportGrid-2" data-name="ImportGrid" class="cls-4" d="M 908.91 726.69 L 908.91 718.54 L 904.83 718.54 L 904.83 726.69 L 859.24 726.69 L 859.24 718.54 L 855.17 718.54 L 855.17 730.77 L 921.51 730.77 L 921.51 726.69 L 908.91 726.69 Z"/>
            <path id="BatteryUsed" class="cls-2" d="M 920.76 603.3 L 916.69 603.3 L 916.69 357.92 L 1054.1 357.92 L 1054.1 339.53 L 1058.17 339.53 L 1058.17 361.87 L 920.76 361.87 L 920.76 603.3 Z"/>
            <path id="ExportGrid" class="cls-3" d="M 941.26 712.41 L 937.19 712.41 L 937.19 368.88 L 1084.92 368.88 L 1084.92 265.81 L 1013.09 265.81 L 1013.09 261.84 L 1088.99 261.84 L 1088.99 372.84 L 941.26 372.84 L 941.26 712.41 Z"/>
            <path id="ExportGrid-2" data-name="ExportGrid" class="cls-3" d="M 940.17 745.59 L 944.24 745.59 L 944.24 904.04 L 940.17 904.04 Z"/>
            <path id="SolarToBattery" class="cls-5" d="M 1033.83 331.32 L 992.35 332.76 L 992.35 286.75 L 996.34 286.75 L 996.34 326.69 L 1033.83 326.69 L 1033.83 331.32 Z"/>
            <path id="SolarUsed" class="cls-5" d="M 910.28 603.6 L 906.2 603.6 L 906.2 350.61 L 983.36 350.61 L 983.36 286.75 L 987.43 286.75 L 987.43 354.56 L 910.28 354.56 L 910.28 603.6 Z"/>
        </svg>
    </div>

    <script>
        // State Machine Logic
        const flowLogic = {
            gas: {
                // Gas always animates
                isActive: (data) => true,
                paths: ['Gas', 'Gas-2']
            },
            solarToHome: {
                // zonneenergie_productie_nu > 0 AND electriciteit_netverbruik_nu == 0 AND batterij_status != "Laden"
                isActive: (data) => {
                    const solar = parseFloat(data['sensor.zonneenergie_productie_nu']) || 0;
                    const gridImport = parseFloat(data['sensor.electriciteit_netverbruik_nu']) || 0;
                    const battStatus = data['sensor.batterij_status'];
                    return solar > 0 && gridImport === 0 && battStatus !== 'Laden';
                },
                paths: ['SolarUsed']
            },
            solarToBattery: {
                // zonneenergie_productie_nu > 0 AND batterij_status == "Laden"
                isActive: (data) => {
                    const solar = parseFloat(data['sensor.zonneenergie_productie_nu']) || 0;
                    const battStatus = data['sensor.batterij_status'];
                    return solar > 0 && battStatus === 'Laden';
                },
                paths: ['SolarToBattery']
            },
            exportGrid: {
                // electriciteit_injectie_nu > 0
                isActive: (data) => {
                    const exportGrid = parseFloat(data['sensor.electriciteit_injectie_nu']) || 0;
                    return exportGrid > 0;
                },
                paths: ['ExportGrid', 'ExportGrid-2']
            },
            importGrid: {
                // electriciteit_netverbruik_nu > 0
                isActive: (data) => {
                    const importGrid = parseFloat(data['sensor.electriciteit_netverbruik_nu']) || 0;
                    return importGrid > 0;
                },
                paths: ['ImportGrid', 'ImportGrid-2']
            },
            batteryUsed: {
                // If you want to animate battery used. The spec mentioned Battery line but no exact condition.
                // Assuming batterij_status == 'Ontladen'
                isActive: (data) => {
                    const battStatus = data['sensor.batterij_status'];
                    return battStatus === 'Ontladen' || battStatus === 'Ontlagen';
                },
                paths: ['BatteryUsed']
            }
        };

        // Update Dashboard Data and Animations
        function updateDashboard(sensorData) {
            // Process the sensorData which is assumed to be a dictionary { 'sensor_id': 'state_value', ... }

            // Evaluate state machine rules and toggle CSS classes
            for (const flow in flowLogic) {
                const logic = flowLogic[flow];
                const active = logic.isActive(sensorData);

                logic.paths.forEach(pathId => {
                    const pathEl = document.getElementById(pathId);
                    if (pathEl) {
                        if (active) {
                            pathEl.classList.add('active');
                        } else {
                            pathEl.classList.remove('active');
                        }
                    }
                });
            }

            // Update metric-cards if they exist in the DOM
            // This expects elements with ID matching the sensor ID (with dots replaced by dashes, e.g. sensor-zonneenergie_productie_nu)
            for (const [sensorId, value] of Object.entries(sensorData)) {
                const safeId = sensorId.replace(/\./g, '-');
                const metricEl = document.getElementById(safeId);
                if (metricEl) {
                    metricEl.textContent = value;
                }
            }
        }

        // --- Example Usage / Mock Data ---
        // To integrate properly, you would call `updateDashboard(realData)` whenever HA returns new data.

        // Uncomment to test with mock data:
        /*
        const mockData = {
            'sensor.zonneenergie_productie_nu': '1500',
            'sensor.electriciteit_netverbruik_nu': '0',
            'sensor.batterij_status': 'Ontladen',
            'sensor.electriciteit_injectie_nu': '500'
        };
        updateDashboard(mockData);
        */
    </script>
</body>
</html>
